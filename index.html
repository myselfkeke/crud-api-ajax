<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD SELF MADE</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- boot strap icon link -->
     <!-- Bootstrap Icons CDN -->
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      />
      
      
      <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h2 class="mb-3">CRUD APPLICATION</h2>
      
      <!-- Add Form -->
      <div  class="card mb-3">
        <div class="card-body">
          <form id="addForm" enctype="multipart/form-data">
            <div class="row g-2">
              <div class="col-md-4">
                <input
                  type="text"
                  placeholder="Name"
                  required
                  name="name"
                  id="name"
                  class="form-control"
                  />
                </div>
                
                <div class="col-md-4">
                <input
                type="email"
                  placeholder="Email"
                  required
                  name="email"
                  id="email"
                  class="form-control"
                  />
                </div>
                
                <div class="col-md-4">
                  <input
                  type="text"
                  placeholder="Phone"
                  required
                  name="phone"
                  id="phone"
                  class="form-control"
                  />
                </div>
                <div class="container mt-3">
                  <!-- Row 1 -->
                  <div class="row align-items-center mb-2">
                    <!-- Label -->
                    <div class="col-md-4 text-end">
                      <label for="resume" class="form-label mb-0 fw-bold">Upload Resume</label>
                    </div>

                    <!-- File input -->
                    <div class="col-md-4">
                      <input class="form-control" type="file" id="resume" name="resume" accept=".pdf, .doc, .docx, .jpeg, .png, .jpg">
                    </div>
                    
                    <div class="col-md-4" style="opacity: 0.9;">
                      <button class="btn btn-primary btn-view-disabled" disabled data-bs-toggle="tooltip" data-bs-placement="top" title="Preview Document">
                        <i class="bi bi-eye"></i> Preview
                      </div>
                    </button>

                    <!-- Empty column -->
                    <div class="col-md-6">
                      
                    </div>
                  </div>

                  <!-- Row 2 -->
                  <div class="row">
                    <!-- Empty -->
                    <div class="col-md-4"></div>

                    <!-- Button just below the file input -->
                    <div class="col-md-4 d-grid">
                      <button class="btn btn-primary btn-add" data-bs-toggle="tooltip" data-bs-placement="top" title="Add">
                        <i class="bi bi-send"></i> Add
                      </button>
                    </div>

                    <!-- Empty -->
                    <div class="col-md-4"></div>
                  </div>
                </div>

              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- message -->
      <div id="messageArea"></div>
           
      <!-- Users Table -->
      
      <div class="card">
        <div class="card-body">
          <table id="usersTable" class="table table-striped table-bordered">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th style="text-align: center;">Resume</th>
                <th style="text-align: center;">Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- dynemically to be filled by JS -->
            </tbody>
          </table>
        </div>
      </div>

             <!-- bootstrap tool tip -->
       <!-- tried fancy bootstrap tool tip but didn't worked -->
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  </body>
  </html>
