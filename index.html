<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD SELF MADE</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- boot strap icon link -->
     <!-- Bootstrap Icons CDN -->
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      />
      
      
      <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h2 class="mb-3">CRUD APPLICATION</h2>
      
      <!-- Add Form -->
      <div  class="card mb-3">
        <div class="card-body">
          <form id="addForm">
            <div class="row g-2">
              <div class="col-md-4">
                <input
                  type="text"
                  placeholder="Name"
                  required
                  name="name"
                  id="name"
                  class="form-control"
                  />
                </div>
                
                <div class="col-md-4">
                <input
                type="email"
                  placeholder="Email"
                  required
                  name="email"
                  id="email"
                  class="form-control"
                  />
                </div>
                
                <div class="col-md-3">
                  <input
                  type="text"
                  placeholder="Phone"
                  required
                  name="phone"
                  id="phone"
                  class="form-control"
                  />
                </div>
                <div class="col-md-1 d-grid">
                  <button class="btn btn-primary btn-add" data-bs-toggle="tooltip" data-bs-placement="top" title="Add"><i class="bi bi-send"></i></button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- message -->
      <div id="messageArea"></div>
      
      <!-- Users Table -->
      
      <div class="card">
        <div class="card-body">
          <table id="usersTable" class="table table-striped table-bordered">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th style="text-align: center;">Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- dynemically to be filled by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Edit box show when edit button is clicked -->
      <div id="editBox" class="card mt3 d-none mTop">
        <div class="card-body">
          <h5>Edit Users</h5>
          <form id="editForm">
            <input type="hidden" name="id" id="edit-id" />
            <div class="row g-2">
              <div class="col-md-4">
                <input
                  type="text"
                  name="name"
                  id="edit-name"
                  class="form-control"
                  placeholder="Name"
                  required
                  />
                </div>
                <div class="col-md-4">
                  <input
                  type="email"
                  name="email"
                  id="edit-email"
                  class="form-control"
                  placeholder="Email"
                  required
                  />
                </div>
                <div class="col-md-3">
                  <input
                  type="text"
                  name="phone"
                  id="edit-phone"
                  class="form-control"
                  placeholder="Phone"
                />
              </div>
              <div class="col-md-1 d-grid"><button class="btn btn-success" title="Save" type="submit"><i class="bi bi-check-circle"></i></button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <!-- bootstrap tool tip -->
       <!-- tried fancy bootstrap tool tip but didn't worked -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

  </body>
  </html>
